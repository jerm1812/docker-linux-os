name: Build and Push Kairos OS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Allow manual triggering with highly configurable parameters
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Kairos Hadron Base Version (e.g., latest)'
        required: true
        default: 'latest'
      image_profile:
        description: 'Comma-separated list of modules to include'
        required: true
        default: 'core,mesh,data,ops,security'
      image_tag:
        description: 'Tag to use for the built image'
        required: true
        default: 'latest-manual'
      zarf_version:
        description: 'Zarf CLI Version'
        required: true
        default: 'v0.75.1'
      os_username:
        description: 'OS Username'
        required: true
        default: 'kairos'
      os_password:
        description: 'OS Password'
        required: true
        default: 'changeme'
      build_iso:
        description: 'Generate bootable ISO?'
        type: boolean
        required: true
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Stage Modules
        run: |
          mkdir -p staging/manifests
          mkdir -p staging/base
          # Always copy the base configuration
          cp modules/base/config.yaml staging/base/config.yaml
          
          # Parse the comma-separated image_profile
          # Default to all if not triggered via workflow_dispatch
          PROFILE="${{ github.event.inputs.image_profile || 'core,mesh,data,ops,security' }}"
          IFS=',' read -ra MODULES <<< "$PROFILE"
          for module in "${MODULES[@]}"; do
            module=$(echo "$module" | xargs) # trim whitespace
            if [ -d "modules/$module" ]; then
              echo "Staging module: $module"
              cp modules/$module/*.yaml staging/manifests/ 2>/dev/null || true
            else
              echo "Warning: Module $module not found."
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and push OS Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_VERSION=${{ github.event.inputs.base_version || 'latest' }}
            OS_USERNAME=${{ github.event.inputs.os_username || 'kairos' }}
            OS_PASSWORD=${{ github.event.inputs.os_password || 'changeme' }}
            ZARF_VERSION=${{ github.event.inputs.zarf_version || 'v0.75.1' }}

  generate-iso:
    runs-on: ubuntu-latest
    needs: build
    # Run if triggered by a tag OR if manually triggered and build_iso is true
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_iso == 'true')
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Generate Kairos ISO
        run: |
          # Use AuroraBoot to transform the built OCI container image into a bootable ISO
          mkdir -p build
          docker run --rm \
            -v $PWD/build:/tmp/auroraboot \
            -v /var/run/docker.sock:/var/run/docker.sock \
            quay.io/kairos/auroraboot:latest \
            --set container_image=oci:${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }} \
            --set disable_http_server=true \
            --set disable_netboot=true \
            --set state_dir=/tmp/auroraboot
            
          # AuroraBoot places the ISO in the state_dir, find it and rename it for release
          find build -name "*.iso" -exec mv {} custom-os-${{ env.TAG_NAME }}.iso \;

      - name: Release ISO
        # Create a GitHub release. For manual dispatches, we might not want to create a standard release, but upload an artifact instead.
        # Here we use action-gh-release if it's a tag, otherwise we upload a build artifact.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: custom-os-${{ env.TAG_NAME }}.iso
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false

      - name: Upload ISO Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: custom-os-${{ env.TAG_NAME }}.iso
          retention-days: 5
